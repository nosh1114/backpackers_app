test:
  service: Disk
  root: <%= Rails.root.join("tmp/storage") %>

local:
  service: Disk
  root: <%= Rails.root.join("storage") %>

# AWS S3 configuration
# 環境変数から設定を読み取ります:
# - AWS_ACCESS_KEY_ID
# - AWS_SECRET_ACCESS_KEY
# - AWS_REGION (デフォルト: ap-northeast-1)
# - AWS_S3_BUCKET
amazon:
  service: S3
  access_key_id: <%= ENV.fetch("AWS_ACCESS_KEY_ID") { "" } %>
  secret_access_key: <%= ENV.fetch("AWS_SECRET_ACCESS_KEY") { "" } %>
  region: <%= ENV.fetch("AWS_REGION", "ap-northeast-1") %>
  bucket: <%= ENV.fetch("AWS_S3_BUCKET") { "" } %>

# Cloudflare R2 configuration (S3互換)
# 一時的に無効化（必要に応じてコメントアウトを解除）
# 環境変数から設定を読み取ります:
# - CLOUDFLARE_R2_ACCESS_KEY_ID
# - CLOUDFLARE_R2_SECRET_ACCESS_KEY
# - CLOUDFLARE_R2_BUCKET
# - CLOUDFLARE_R2_ENDPOINT (例: https://<アカウントID>.r2.cloudflarestorage.com)
# r2:
#   service: S3
#   access_key_id: <%= ENV.fetch("CLOUDFLARE_R2_ACCESS_KEY_ID") { "" } %>
#   secret_access_key: <%= ENV.fetch("CLOUDFLARE_R2_SECRET_ACCESS_KEY") { "" } %>
#   region: "auto"  # R2は"auto"を使用
#   bucket: <%= ENV.fetch("CLOUDFLARE_R2_BUCKET") { "" } %>
#   endpoint: <%= ENV.fetch("CLOUDFLARE_R2_ENDPOINT") { "" } %>
#   force_path_style: true  # R2では必須

# Remember not to checkin your GCS keyfile to a repository
# google:
#   service: GCS
#   project: your_project
#   credentials: <%= Rails.root.join("path/to/gcs.keyfile") %>
#   bucket: your_own_bucket-<%= Rails.env %>

# Use bin/rails credentials:edit to set the Azure Storage secret (as azure_storage:storage_access_key)
# microsoft:
#   service: AzureStorage
#   storage_account_name: your_account_name
#   storage_access_key: <%= Rails.application.credentials.dig(:azure_storage, :storage_access_key) %>
#   container: your_container_name-<%= Rails.env %>

